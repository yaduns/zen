[workspace]
resolver = "2"
members = [
    "crates/zen-ai",
    "crates/zen-app",
    "crates/zen-core",
    "crates/zen-tui",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.97"
license = "MIT"
authors = ["Zen Contributors"]

# ──────────────────────────────────────────────────────────────────
#  shared workspace dependency versions
#  all crate-level Cargo.toml should reference these via
#  `dep_name.workspace = true` unless a crate needs a specific override.
# ──────────────────────────────────────────────────────────────────
[workspace.dependencies]

# Workspace crates
zen-ai = { path = "crates/zen-ai" }
zen-core = { path = "crates/zen-core" }
zen-app = { path = "crates/zen-app" }

# ── async runtime ────────────────────────────────────────────────
tokio = { version = "1", features = [
    "macros",
    "sync",
    "rt-multi-thread",
    "fs",
    "process",
    "io-util",
    "signal",
    "io-std",
] }
tokio-util = "0.7"

# ── serialization (core types → JSONL, API request/response) ────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── UUIDv7 (session / tool-call identifiers) ─────────────────────
uuid = { version = "1", features = ["v7", "serde"] }

# ── HTTP client (OpenAI-compatible API calls) ────────────────────
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

# ── SSE streaming (LLM streaming response parsing) ───────────────
eventsource-stream = "0.2"

# ── error handling ───────────────────────────────────────────────
thiserror = "2"
anyhow = "1"

# ── CLI argument parsing ─────────────────────────────────────────
clap = { version = "4", features = ["derive"] }

# ── TUI ──────────────────────────────────────────────────────────
# crossterm: terminal manipulation library for TUI (raw mode, cursor, colors, keyboard).
# Used directly instead of ratatui — better fit for chat-style TUI.
crossterm = { version = "0.28", features = ["event-stream"]}

# ── Markdown rendering (terminal output in TUI & print mode) ────
pulldown-cmark = "0.13"

# ── Regex (overflow pattern matching, REQ-AI-01 / T-AI-01-8) ──
regex = "1"

# ── Syntax highlighting (replaces highlight.js) ──────────────────
# default-fancy = pure-Rust regex engine, avoids C lib oniguruma.
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
] }

# ── JSON Schema (tool parameter validation, REQ-AI-03) ───────────
schemars = "1"
jsonschema = "0.18"

# ── Observability (tracing spans → diagnostics) ─────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
] }
tracing-appender = "0.2"

# ── miscellaneous ────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

futures-util = "0.3"
futures = "0.3"

# ── async trait (dyn-compatible async methods in AgentTool) ─────
async-trait = "0.1"

unicode-normalization = "0.1"
tempfile = "3"
similar = "2"
ignore = "0.4"
libc = "0.2"

# ── path utilities (tilde expansion home dir, file:// URL parsing, T-AP-09-1) ──
home = "0.5"
url = "2"

unicode-width = "0.1"
unicode-segmentation = "1"
