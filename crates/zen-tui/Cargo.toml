[package]
name = "zen-tui"
version.workspace = true
edition.workspace = true
description = "Zen TUI"

[dependencies]
tracing = { workspace=true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
# Syntax highlighting (T-AP-10-1, REQ-APP-10): workspace pre-declares dependency slots (default-fancy = pure Rust regex,
# avoids onig C dependency; embeds default-syntaxes/default-themes, covering Rust/TS/Python/Go/JSON/YAML/Markdown).
syntect = { workspace = true }
# Home directory resolution (~ expansion, autocomplete expand_home_path) — workspace's existing `home` crate
# (aligned with zen-core/src/paths.rs and zen-app config precedent); the `dirs` originally proposed in the task doc is no longer introduced.
home = { workspace = true }
# In-process recursive directory traversal (@ attachment autocomplete, replacing pi's external fd binary): same-origin as fd/ripgrep's
# `ignore` crate — respects .gitignore/.ignore/.git/info/exclude (at-gitignore-fix: aligned with pi's
# fd default behavior; ignored directories such as target/ no longer appear in @ candidates) + built-in loop protection.
ignore = { workspace = true }
pulldown-cmark = { workspace = true }
zen-core = { workspace = true }
zen-ai = { workspace = true }
# Theme system (T-AP-11-3): JSON theme file deserialization
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio-util = { workspace = true }
tempfile = { workspace = true }
