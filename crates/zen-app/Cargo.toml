[package]
name = "zen-app"
version.workspace = true
edition.workspace = true
description = "Zen app"

[[bin]]
name = "zen"
path = "src/main.rs"

[dependencies]
tracing = { workspace=true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
zen-core = { workspace = true }
zen-ai = { workspace = true }
zen-tui = { path = "../zen-tui" }
# File watching (theme hot reload, T-AP-11-3)
notify = { workspace = true }
# Word-level diff (T-AP-11-2 diff component; existing workspace declaration, same family as zen-core edit_diff)
similar = { workspace = true }
# Session search regex mode (T-AP-11-2 session-selector-search)
regex = { workspace = true }

[dev-dependencies]
tokio-util = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
