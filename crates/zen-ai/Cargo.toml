[package]
name = "zen-ai"
version.workspace = true
edition.workspace = true
description = "AI infrastructure for Zen"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
async-trait = { workspace = true }
jsonschema = { workspace = true }

[dev-dependencies]
# `IdleBodyStream` (httpIdleTimeoutMs watchdog) tests drive a paused clock instead of real sleeps, so they are
# deterministic under load. Dev-only: production tokio features are unchanged.
tokio = { workspace = true, features = ["test-util"] }
